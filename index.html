<title>Women's Foundation Program</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f5f2;--surface:#fff;--surface2:#f0ede8;
  --border:#e2ddd7;--text:#1a1714;--muted:#8a8278;
  --accent:#2d6a4f;--accent-light:#d8f3dc;--accent-text:#1b4332;
  --warn:#e76f51;--radius:10px;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;position:sticky;top:0;z-index:100}
header h1{font-size:15px;font-weight:600;margin-bottom:2px}
header p{font-size:12px;color:var(--muted)}
.progress-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.progress-bar{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.progress-label{font-size:11px;color:var(--muted);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.controls{padding:12px 20px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.sel-wrap{display:flex;flex-direction:column;gap:3px}
.sel-wrap label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
select{font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer}
.reset-btn{font-size:12px;padding:7px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--muted);cursor:pointer;margin-top:auto}
.reset-btn:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
.date-row{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.date-row label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.date-row input[type=date]{font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text)}
.scroll-row{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);scrollbar-width:none}
.scroll-row::-webkit-scrollbar{display:none}
.tab-btn{font-size:12px;font-weight:500;padding:6px 14px;border:1px solid var(--border);border-radius:99px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.content{padding:16px 20px;max-width:680px;margin:0 auto}
.complete-banner{background:var(--accent-light);border:1px solid #95d5b2;border-radius:var(--radius);padding:14px;margin-bottom:16px;text-align:center;font-size:14px;font-weight:500;color:var(--accent-text)}
.section{margin-bottom:20px}
.section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.item{padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:6px;border-left:3px solid transparent;transition:border-color .2s,opacity .2s}
.item.all-done{border-left-color:var(--accent);opacity:.6}
.item-name{font-size:14px;font-weight:500;margin-bottom:2px}
.item-meta{font-size:12px;color:var(--muted);line-height:1.4}
.item-note{font-size:11px;color:var(--muted);margin-top:3px;font-style:italic}
.set-bubbles{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
.bubbles-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:2px;flex-shrink:0}
.bubble{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;-webkit-tap-highlight-color:transparent;line-height:1}
.bubble:active{transform:scale(.9)}
.bubble.warmup{border-style:dashed;color:var(--muted)}
.bubble.done{background:var(--accent);border-color:var(--accent);border-style:solid;color:#fff}
.bubble.warmup.done{background:#52a882;border-color:#52a882}
.legend{font-size:10px;color:var(--muted);margin-left:4px;flex-basis:100%;margin-top:2px}
.legend-w{color:#52a882;font-weight:700}
.legend-k{color:var(--accent);font-weight:700}
.weight-row{display:flex;align-items:center;gap:6px;margin-top:8px}
.weight-input{font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);flex:1;min-width:0}
.weight-input::placeholder{color:var(--muted)}
.wsave{font-size:11px;padding:6px 12px;border:1px solid var(--accent);border-radius:6px;background:var(--accent-light);color:var(--accent-text);cursor:pointer;flex-shrink:0;white-space:nowrap}
.wsave:active{background:var(--accent);color:#fff}
.weight-history{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.wtag{font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-variant-numeric:tabular-nums}
.wtag.today{border-color:var(--accent);background:var(--accent-light);color:var(--accent-text)}
.wtag-date{color:var(--muted);margin-right:3px}
.wtag-val{font-weight:500}
</style>
</head>
<body>
<header>
  <h1>Women's Foundation Program</h1>
  <p>Stephanie Buttermore</p>
  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <span class="progress-label" id="prog-label">0 / 0</span>
  </div>
</header>

<div class="controls">
  <div class="sel-wrap">
    <label>Split</label>
    <select id="split-sel"><option value="3day">3-day full body</option></select>
  </div>
  <div class="sel-wrap">
    <label>Block</label>
    <select id="block-sel">
      <option value="1">Block 1 (Weeks 1-4)</option>
      <option value="2">Block 2 (Weeks 5-8)</option>
    </select>
  </div>
  <button class="reset-btn" onclick="resetDay()">Reset day</button>
</div>

<div class="date-row">
  <label>Date</label>
  <input type="date" id="workout-date">
</div>
<div class="scroll-row" id="week-tabs"></div>
<div class="scroll-row" id="day-tabs"></div>

// ─── Storage ─────────────────────────────────────────────────────────────────
var _mem = {};
function _set(k,v){var s=JSON.stringify(v);_mem[k]=s;try{localStorage.setItem(k,s);}catch(e){}}
function _get(k){try{var v=localStorage.getItem(k);if(v!==null)return JSON.parse(v);}catch(e){}if(_mem[k])try{return JSON.parse(_mem[k]);}catch(e){}return null;}

var SK="wfp2_state", WK="wfp2_weights", SK2="wfp2_sets";

function today(){return new Date().toISOString().slice(0,10);}
function loadState(){
  var p=_get(SK);
  return{
    split: (p&&p.split)||"3day",
    block: (p&&p.block)||"1",
    weekIdx: (p&&p.weekIdx!=null)?p.weekIdx:0,
    dayIdx:  (p&&p.dayIdx!=null)?p.dayIdx:0,
    date:  (p&&p.date)||today()
  };
}
var state=loadState();
var weights=_get(WK)||{};
var setDone=_get(SK2)||{};
function saveState(){_set(SK,state);}
function saveWeights(){_set(WK,weights);}
function saveSets(){_set(SK2,setDone);}

// ─── Keys ─────────────────────────────────────────────────────────────────────
function slug(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,"_");}
function wkey(n){return state.date+"|"+slug(n);}
function skey(n,i){return state.date+"|"+slug(n)+"|s"+i;}
function ckey(wi,di,si,ii){return state.split+"|"+state.block+"|"+wi+"|"+di+"|"+si+"|"+ii;}

// ─── Program helpers ──────────────────────────────────────────────────────────
function getWeeks(){return PROGRAMS[state.split][state.block].weeks;}
function getDays(){return getWeeks()[state.weekIdx].days;}

// ─── Parse meta string → {warmup, working, reps} ─────────────────────────────
function parseMeta(meta){
  var wu=0, wk=0, reps="";
  // "Nw+Xk sets" or "N warm-up + X working"
  var m=meta.match(/(\d+)\s*\+\s*(\d+)\s*sets/);
  if(!m) m=meta.match(/(\d+)\s*warm[^+]*\+\s*(\d+)/i);
  if(m){wu=+m[1];wk=+m[2];}
  else{
    var w=meta.match(/(\d+)\s*(?:working\s*sets?|working)/i);
    if(w)wk=+w[1];
    else{var s=meta.match(/(\d+)\s*sets?/i);if(s)wk=+s[1];else wk=0;}
    // purely warmup items (no working sets listed)
    if(meta.match(/cardio|wall.?sit|leg swing|glute squeeze|trap raise|external rotation|overhead shrug/i)){wu=wk;wk=0;}
  }
  // reps
  if(meta.match(/amrap/i))reps="MAX";
  else{
    var r=meta.match(/(\d+)[^\d](\d+)\s*reps?/i);
    if(r)reps=r[1]+"-"+r[2];
    else{r=meta.match(/(\d+)\s*reps?/i);if(r)reps=r[1];}
    if(!reps){r=meta.match(/(\d+(?:\.\d+)?)\s*(?:sec|min)/i);if(r)reps=r[1]+"s";}
    if(!reps){r=meta.match(/(\d+)\s*each/i);if(r)reps=r[1]+"e";}
  }
  return{wu:wu,wk:wk,reps:reps};
}

// ─── UI helpers ───────────────────────────────────────────────────────────────
function syncSelects(){
  document.getElementById("split-sel").value=state.split;
  document.getElementById("block-sel").value=state.block;
  document.getElementById("workout-date").value=state.date;
}
function renderWeekTabs(){
  document.getElementById("week-tabs").innerHTML=getWeeks().map(function(w,i){
    return "<button class=\"tab-btn"+(i===state.weekIdx?" active":"")+"\" onclick=\"selWeek("+i+")\">Week "+w.week+"</button>";
  }).join("");
}
function renderDayTabs(){
  document.getElementById("day-tabs").innerHTML=getDays().map(function(d,i){
    return "<button class=\"tab-btn"+(i===state.dayIdx?" active":"")+"\" onclick=\"selDay("+i+")\">"+d.label+"</button>";
  }).join("");
}

// ─── Progress ─────────────────────────────────────────────────────────────────
function countItems(){
  var total=0,done=0;
  getDays()[state.dayIdx].sections.forEach(function(sec,si){
    sec.items.forEach(function(itm,ii){
      var p=parseMeta(itm.meta);
      var total_sets=p.wu+p.wk;
      if(total_sets===0)return;
      total++;
      if(setDone[ckey(state.weekIdx,state.dayIdx,si,ii)+"_done"])done++;
    });
  });
  return{total:total,done:done};
}
function updateProgress(){
  var r=countItems();
  var pct=r.total?Math.round(r.done/r.total*100):0;
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("prog-label").textContent=r.done+" / "+r.total;
}

// ─── Toggle a set bubble ──────────────────────────────────────────────────────
function toggleSet(name,idx,ck,totalSets,reps){
  var k=skey(name,idx);
  setDone[k]=!setDone[k];
  var bEl=document.getElementById("bbl_"+slug(name)+"_"+idx);
  if(bEl){
    if(setDone[k]){bEl.classList.add("done");bEl.textContent="\u2713";}
    else{bEl.classList.remove("done");bEl.textContent=reps?reps:(idx+1);}
  }
  // check if all sets done
  var allDone=true;
  for(var i=0;i<totalSets;i++){if(!setDone[skey(name,i)]){allDone=false;break;}}
  setDone[ck+"_done"]=allDone;
  saveSets();
  var itemEl=document.getElementById("itm_"+slug(name));
  if(itemEl)itemEl.classList.toggle("all-done",allDone);
  updateProgress();
}

// ─── Save weight ──────────────────────────────────────────────────────────────
function saveWeight(name){
  var eid=slug(name);
  var inp=document.getElementById("wi_"+eid);
  if(!inp)return;
  var val=inp.value.trim();
  if(!val)return;
  weights[wkey(name)]={date:state.date,exercise:name,val:val};
  saveWeights();
  var btn=document.getElementById("wsb_"+eid);
  if(btn){btn.textContent="Saved!";btn.style.background="var(--accent)";btn.style.color="#fff";setTimeout(function(){btn.textContent="Save";btn.style.background="";btn.style.color="";},1400);}
  renderHistory(name);
}
function getHistory(name){
  var s=slug(name);
  return Object.values(weights).filter(function(e){return e.exercise&&slug(e.exercise)===s;}).sort(function(a,b){return b.date<a.date?-1:1;});
}
function renderHistory(name){
  var el=document.getElementById("wh_"+slug(name));
  if(!el)return;
  var hist=getHistory(name);
  if(!hist.length){el.innerHTML="";return;}
  el.innerHTML=hist.slice(0,6).map(function(e){
    var t=e.date===state.date?" today":"";
    return "<span class=\"wtag"+t+"\"><span class=\"wtag-date\">"+e.date+"</span><span class=\"wtag-val\">"+e.val+"</span></span>";
  }).join("");
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render(){
  var day=getDays()[state.dayIdx];
  var r=countItems();
  var html="";
  if(r.total>0&&r.done===r.total)html+="<div class=\"complete-banner\">Workout complete! Great work today.</div>";

  day.sections.forEach(function(sec,si){
    html+="<div class=\"section\"><div class=\"section-label\">"+sec.name+"</div>";
    sec.items.forEach(function(itm,ii){
      var ck=ckey(state.weekIdx,state.dayIdx,si,ii);
      var allDone=!!setDone[ck+"_done"];
      var eid=slug(itm.name);
      var p=parseMeta(itm.meta);
      var totalSets=p.wu+p.wk;
      var isWorking=sec.name.toLowerCase().indexOf("work")!==-1||sec.name.toLowerCase().indexOf("amrap")!==-1;

      // Build bubbles
      var bubblesHtml="";
      if(totalSets>0){
        bubblesHtml="<div class=\"set-bubbles\">";
        bubblesHtml+="<span class=\"bubbles-label\">"+(p.wu>0&&p.wk>0?"Sets":"Sets")+"</span>";
        for(var i=0;i<totalSets;i++){
          var isWu=i<p.wu;
          var bk=skey(itm.name,i);
          var bdone=!!setDone[bk];
          var bLabel=bdone?"&#10003;":(p.reps?p.reps:(i+1));
          var bClass="bubble"+(isWu?" warmup":"")+(bdone?" done":"");
          bubblesHtml+="<button id=\"bbl_"+eid+"_"+i+"\" class=\""+bClass+"\" onclick=\"toggleSet('"+eid+"',"+i+",'"+ck+"',"+totalSets+",'"+p.reps+"')\">"+bLabel+"</button>";
        }
        if(p.wu>0&&p.wk>0)bubblesHtml+="<span class=\"legend\"><span class=\"legend-w\">&#9632;</span> warm-up &nbsp; <span class=\"legend-k\">&#9632;</span> working</span>";
        bubblesHtml+="</div>";
      }

      // Weight log (working sections only)
      var weightHtml="";
      if(isWorking){
        var saved=weights[wkey(itm.name)];
        var prefill=saved?saved.val:"";
        weightHtml="<div class=\"weight-row\">"
          +"<input class=\"weight-input\" id=\"wi_"+eid+"\" type=\"text\" placeholder=\"weight / notes\" value=\""+prefill.replace(/"/g,"&quot;")+"\" onkeydown=\"if(event.keyCode===13)saveWeight('"+eid+"');\">"
          +"<button class=\"wsave\" id=\"wsb_"+eid+"\" onclick=\"saveWeight('"+eid+"')\">Save</button>"
          +"</div>"
          +"<div class=\"weight-history\" id=\"wh_"+eid+"\"></div>";
      }

      html+="<div class=\"item"+(allDone?" all-done":"")+"\" id=\"itm_"+eid+"\">"
        +"<div class=\"item-name\">"+itm.name+"</div>"
        +"<div class=\"item-meta\">"+itm.meta+"</div>"
        +(itm.note?"<div class=\"item-note\">"+itm.note+"</div>":"")
        +bubblesHtml+weightHtml
        +"</div>";
    });
    html+="</div>";
  });

  document.getElementById("checklist").innerHTML=html;
  // restore histories
  day.sections.forEach(function(sec){
    sec.items.forEach(function(itm){renderHistory(itm.name);});
  });
  updateProgress();
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function selWeek(i){state.weekIdx=i;state.dayIdx=0;saveState();renderWeekTabs();renderDayTabs();render();}
function selDay(i){state.dayIdx=i;saveState();renderDayTabs();render();}
function resetDay(){
  var day=getDays()[state.dayIdx];
  day.sections.forEach(function(sec,si){
    sec.items.forEach(function(itm,ii){
      var ck=ckey(state.weekIdx,state.dayIdx,si,ii);
      delete setDone[ck+"_done"];
      var p=parseMeta(itm.meta);
      for(var i=0;i<p.wu+p.wk;i++)delete setDone[skey(itm.name,i)];
    });
  });
  saveSets();render();
}

// ─── Event listeners ─────────────────────────────────────────────────────────
document.getElementById("split-sel").addEventListener("change",function(){state.split=this.value;state.weekIdx=0;state.dayIdx=0;saveState();renderWeekTabs();renderDayTabs();render();});
document.getElementById("block-sel").addEventListener("change",function(){state.block=this.value;state.weekIdx=0;state.dayIdx=0;saveState();renderWeekTabs();renderDayTabs();render();});
document.getElementById("workout-date").addEventListener("change",function(){state.date=this.value;saveState();render();});

// ─── Init ─────────────────────────────────────────────────────────────────────
syncSelects();renderWeekTabs();renderDayTabs();render();
</script>
